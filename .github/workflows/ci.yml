name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 14 is the oldest runtime the host is known to ship; 22 is current LTS.
        node: ['14.21.3', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check every module
        run: |
          for f in lib/*.js test/harness.js test/paths.mjs test/deep.mjs scripts/selfcheck.mjs; do
            node --check "$f"
          done

      - name: Manifest and bundle patch
        run: node scripts/selfcheck.mjs

      - name: Deep-clean worker pool and prompt parsing
        run: node test/paths.mjs && node test/deep.mjs

      - name: Settings page renders in every state
        working-directory: test
        run: |
          npm install --no-audit --no-fund
          node harness.js

  pack:
    name: tarball contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm pack --dry-run
      - name: The bundle patch must be inside the tarball
        run: npm pack --silent > /dev/null && tar -tzf dsh-sweeper-*.tgz | grep -qx 'package/cordis.patch.yml'
